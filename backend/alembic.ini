# Alembic configuration for the Synpo GTM backend.
# The database URL is read from DATABASE_URL in alembic/env.py (not stored here).

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Timestamps are stored as strings, so autogenerate doesn't need type compares
# for them; keep default behaviour otherwise.
