<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Synpo GTM Lead Capture</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="panel">
      <header>
        <p class="label">Synpo GTM</p>
        <h1>Lead Capture</h1>
      </header>

      <section class="profile">
        <span class="muted">Active profile</span>
        <strong id="handle">—</strong>
        <div id="snapshot" class="snapshot" hidden></div>
      </section>

      <button id="addButton" type="button">Add to pipeline</button>
      <button id="addAllButton" type="button" class="secondary" hidden>Add All Verified</button>
      <button id="retryButton" type="button" class="secondary" hidden>Retry unsaved</button>

      <p id="status" class="status">Open an Instagram profile page.</p>
      <p id="batchResult" class="status" hidden></p>

      <details>
        <summary>Settings</summary>
        <label for="apiBaseUrl">API base URL</label>
        <input id="apiBaseUrl" type="text" spellcheck="false" placeholder="http://127.0.0.1:8000" />
        <label for="apiKey">API key <span class="muted">(x-api-key, optional)</span></label>
        <input id="apiKey" type="password" spellcheck="false" placeholder="optional" />
        <button id="saveSettings" type="button" class="secondary">Save settings</button>
        <button id="checkConnection" type="button" class="secondary">Check connection</button>
        <p class="muted">Stored locally in this browser. The API key is never sent anywhere except your backend.</p>
      </details>
    </main>
    <script src="lib.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
